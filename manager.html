<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b1637"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="KVN Manager"><link rel="apple-touch-icon" href="assets/kvn-icon-192.png"><link rel="manifest" href="manager-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>KVN Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{
  --wine:#6b1637;--wine-deep:#3d0d21;--wine-soft:#8a2050;
  --marigold:#e8a52e;--marigold-deep:#c48317;--gold:#d4af37;--gold-soft:#f0d689;
  --bg:#fdf5e6;--ivory:#fffbf2;
  --line:#f0dfb7;--ink:#2a1620;--muted:#6f5b62;
  --booked:#6b1637;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:radial-gradient(#c48317 .5px,transparent .5px);background-size:9px 9px;z-index:0}
html{scroll-behavior:smooth}
.app{max-width:960px;margin:auto;padding:14px;position:relative;z-index:1}
.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{position:sticky;top:0;z-index:20;padding:12px 14px;margin-bottom:12px;background:rgba(253,245,230,.92);backdrop-filter:blur(14px);border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 20px rgba(61,13,33,.06)}
.brand{display:flex;align-items:center;gap:12px;color:var(--wine-deep);font-family:'Fraunces',Georgia,serif;font-size:1.1rem;font-weight:500}
.brand img{width:52px;height:52px;border-radius:10px;object-fit:contain;background:var(--ivory);padding:5px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(61,13,33,.14)}
.card{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;box-shadow:0 18px 44px rgba(61,13,33,.08);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--wine),var(--marigold),var(--gold),var(--marigold),var(--wine));opacity:.85}
.hidden{display:none}
#calendarTab.hidden,#enquiryTab.hidden{display:none!important}
.login{max-width:440px;margin:12vh auto}
.h{font:400 2rem 'Fraunces',Georgia,serif;color:var(--wine);margin:8px 0 14px;letter-spacing:-.01em}
.h em{font-style:italic;color:var(--marigold-deep)}
label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin:12px 0 6px;letter-spacing:.12em;text-transform:uppercase}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font:400 16px 'Manrope',sans-serif;background:#fff;color:var(--ink);transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--wine);box-shadow:0 0 0 3px rgba(107,22,55,.14)}
textarea{min-height:96px;resize:vertical}
.btn{border:0;border-radius:9px;padding:12px 18px;background:linear-gradient(135deg,var(--wine),var(--wine-soft));color:var(--bg);font-weight:700;font-family:'Manrope',sans-serif;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.3s;box-shadow:0 6px 16px rgba(107,22,55,.22)}
.btn:hover{background:linear-gradient(135deg,var(--wine-deep),var(--wine));transform:translateY(-1px);box-shadow:0 10px 22px rgba(107,22,55,.32)}
.light{background:var(--ivory);color:var(--wine);border:1px solid var(--line);box-shadow:none}
.light:hover{background:var(--bg);border-color:var(--marigold);color:var(--wine-deep);box-shadow:0 6px 14px rgba(232,165,46,.18)}
.tabs{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:86px;z-index:19;background:rgba(253,245,230,.92);padding:8px;border-radius:14px;backdrop-filter:blur(10px);border:1px solid var(--line)}
.tabs button{flex:1;min-height:46px}
.tabs .active{background:linear-gradient(135deg,var(--wine),var(--wine-soft));color:var(--bg)}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.calendar-head .btn{min-width:44px;min-height:44px;padding:8px;font-size:1.3rem;background:#fff;color:var(--wine);border:1px solid var(--line);box-shadow:none}
.calendar-head .btn:hover{background:var(--wine);color:#fff}
.month{font:400 1.6rem 'Fraunces',Georgia,serif;color:var(--wine);flex:1;text-align:center;letter-spacing:-.01em}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;color:var(--muted);font-size:.66rem;padding:8px 0;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.day{aspect-ratio:1/1;border:1px solid transparent;border-radius:14px;background:transparent;padding:0;position:relative;cursor:pointer;transition:transform .28s cubic-bezier(.4,.14,.3,1);display:flex;align-items:center;justify-content:center}
.day-circle{width:80%;aspect-ratio:1/1;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(107,22,55,.08);transition:box-shadow .25s,transform .25s;overflow:hidden}
.day-circle:before,.day-circle:after{content:"";position:absolute;left:0;right:0;height:50%;transition:background .3s}
.day-circle:before{top:0}
.day-circle:after{bottom:0}
.day-circle.am-available:before{background:linear-gradient(180deg,#efbc4d,var(--marigold))}
.day-circle.am-booked:before{background:linear-gradient(180deg,#7f1c40,var(--wine))}
.day-circle.pm-available:after{background:linear-gradient(0deg,#efbc4d,var(--marigold))}
.day-circle.pm-booked:after{background:linear-gradient(0deg,#7f1c40,var(--wine))}
.day-num{position:relative;z-index:3;color:#fff;font:800 1rem 'Manrope',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.28);letter-spacing:-.01em}
.day-divider{position:absolute;left:10%;right:10%;top:50%;height:1.5px;background:rgba(255,255,255,.55);z-index:2;transform:translateY(-50%)}
.mu-mark-mgr{position:absolute;top:-4px;right:-4px;width:20px;height:20px;background:linear-gradient(135deg,var(--gold),var(--marigold));border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--wine-deep);font-size:.66rem;font-weight:900;box-shadow:0 3px 8px rgba(212,175,55,.45);z-index:4;line-height:1}
.day:hover:not(.past) .day-circle{transform:scale(1.06);box-shadow:0 10px 20px rgba(107,22,55,.16)}
.day:hover:not(.past){transform:translateY(-2px)}
.day:active:not(.past) .day-circle{transform:scale(.95)}
.day.selected .day-circle{outline:3px solid rgba(232,165,46,.6);outline-offset:2px}
.day.past{cursor:default}
.day.past .day-circle{background:#efe6cd;box-shadow:none;opacity:.5}
.day.past .day-circle:before,.day.past .day-circle:after,.day.past .day-divider{display:none}
.day.past .day-num{color:#a89f8c;text-shadow:none}
.day.empty{visibility:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#editor{scroll-margin-top:140px}
.enq{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;margin-top:10px;box-shadow:0 4px 12px rgba(61,13,33,.05);transition:opacity .25s,filter .25s,background .25s}
.enq.resolved{opacity:.55;filter:saturate(.5);background:#f5eddb}
.enq.resolved .status{background:#e2d8bf;color:#6f5b62}
.enq .row{align-items:flex-start}
.enq select{min-height:44px}
.small{font-size:.82rem;color:var(--muted);line-height:1.6}
.status{font-size:.66rem;font-weight:800;background:var(--gold-soft);color:var(--wine-deep);padding:5px 10px;border-radius:99px;letter-spacing:.08em;text-transform:uppercase}
.msg{padding:11px 13px;border-radius:9px;margin-top:10px;font-size:.84rem;word-break:break-word}
.live-notify{position:sticky;top:140px;z-index:25;box-shadow:0 6px 18px rgba(61,13,33,.14)}
.ok{background:#f5f7e6;color:#446321;border:1px solid #d5deb2}
.err{background:#fbe9ec;color:#8a2050;border:1px solid #eecad0}
.editor-actions{margin-top:14px}
.slot-section{margin-top:18px;padding:16px;background:linear-gradient(135deg,#fbedcc,#fce4d6);border:1px solid var(--line);border-radius:12px}
.slot-section-title{font:600 .95rem 'Fraunces',Georgia,serif;color:var(--wine-deep);margin-bottom:10px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.booking-fields{display:none;animation:slideDown .3s ease}
.booking-fields.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* Desktop-only layout fix: calendar + date editor side-by-side. Enquiries stays in its own tab. */
@media(min-width:901px){
  .app{max-width:1200px;padding:14px 18px}
  #calendarTab{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);gap:14px;align-items:start}
  #calendarTab > .card:first-child{grid-column:1;grid-row:1;margin-bottom:0}
  #editor{grid-column:2;grid-row:1;margin-bottom:0;position:sticky;top:92px;max-height:calc(100dvh - 108px);overflow:auto;scroll-margin-top:92px}
}
@media(max-width:700px){
  .app{padding:9px}
  .brand img{width:44px;height:44px}
  .brand{font-size:.94rem}
  .card{padding:16px;border-radius:12px}
  .login{margin:6vh auto 0}
  .h{font-size:1.6rem}
  .month{font-size:1.28rem}
  .week,.days{gap:4px}
  .week div{font-size:.58rem;padding:6px 0}
  .day-num{font-size:.86rem}
  .mu-mark-mgr{width:16px;height:16px;font-size:.56rem}
  .grid{grid-template-columns:1fr}
  .editor-actions{position:sticky;bottom:0;background:var(--ivory);padding-top:9px}
  .enq p{font-size:.86rem;line-height:1.55}
  .status{white-space:nowrap}
  .row{flex-wrap:wrap}
  .tabs{top:80px}
  .tabs button{font-size:.82rem;padding:10px 8px}
}
@media(max-width:420px){
  .app{padding:6px}
  .top{padding:10px 12px}
  .top .brand span{font-size:.82rem}
  .tabs{gap:6px}
  .month{font-size:1.12rem}
  .cal-nav{gap:4px}
  .calendar-head .btn{min-width:40px;min-height:40px;font-size:1.15rem}
}
[data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1)}
[data-reveal].in{opacity:1;transform:none}
@keyframes dayIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.days .day:not(.empty){animation:dayIn .34s cubic-bezier(.16,1,.3,1) both}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  [data-reveal]{opacity:1;transform:none}
}
</style></head><body><main class="app">
<div id="login" class="card login"><div class="brand"><img src="assets/logo.webp" alt="KVN Weddings & Conventions"><span>KVN Admin / Manager</span></div><h1 class="h">KVN Admin / Manager <em>Login</em></h1><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:10px" id="loginBtn">Login</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="top"><div class="brand"><img src="assets/logo.webp" alt="KVN Weddings & Conventions"><span>Admin / Manager</span></div><div style="display:flex;gap:7px;align-items:center"><button class="btn light hidden" id="installBtn">Install App</button><button class="btn light" id="logout">Logout</button></div></div>
<div class="tabs"><button class="btn active" data-tab="calendarTab">Calendar</button><button class="btn light" data-tab="enquiryTab">Enquiries</button></div>
<section id="calendarTab"><div class="card"><div class="calendar-head"><button class="btn light" id="prev">‹</button><div class="month" id="month"></div><button class="btn light" id="next">›</button></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days" id="days"></div></div><div class="card" id="editor"><div class="h">Select a date</div><div class="small">Choose a date to edit availability and private manager notes.</div></div></section>
<section id="enquiryTab" class="hidden"><div class="card"><div class="row"><div class="h">Enquiries</div><button class="btn light" id="refresh">Refresh</button></div><div id="enquiries">Loading…</div></div></section>
</div></main>
<script>
const configured=window.KVN_SUPABASE_URL&&!window.KVN_SUPABASE_URL.includes("YOUR-")&&window.KVN_SUPABASE_ANON_KEY&&!window.KVN_SUPABASE_ANON_KEY.includes("YOUR-");
const sb=configured?supabase.createClient(window.KVN_SUPABASE_URL,window.KVN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"kvn-manager-auth"}}):null;
const MANAGER_AUTH_KEY="kvn-manager-authorized";
let view=new Date(new Date().getFullYear(),new Date().getMonth(),1),rows={},mus={},bookings={},selected=null,appStarted=false,realtimeChannel=null,deferredInstallPrompt=null;
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shape(r){if(!r||r.morning_status==="available"&&r.evening_status==="available")return"avail";if(r.morning_status==="booked"&&r.evening_status==="booked")return"booked";return r.evening_status==="booked"?"am":"pm"}
function getCachedManager(){try{return JSON.parse(localStorage.getItem(MANAGER_AUTH_KEY)||"null")}catch(e){return null}}
function cacheManager(user,profile){try{localStorage.setItem(MANAGER_AUTH_KEY,JSON.stringify({user_id:user.id,active:true,display_name:profile?.display_name||"",saved_at:Date.now()}))}catch(e){}}
async function start(){if(!sb){loginMsg.innerHTML='<div class="msg err">Configure Supabase first.</div>';return}const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);else login.classList.remove("hidden");sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){appStarted=false;if(realtimeChannel){sb.removeChannel(realtimeChannel);realtimeChannel=null}app.classList.add("hidden");login.classList.remove("hidden")}else if(session&&(event==="SIGNED_IN"||event==="TOKEN_REFRESHED"||event==="INITIAL_SESSION")&&!appStarted){enter(session.user)}})}
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible"||!sb)return;try{const {data}=await sb.auth.getSession();if(data.session&&!appStarted)await enter(data.session.user)}catch(e){console.warn("Session restore failed",e)}});window.addEventListener("pageshow",async()=>{if(!sb)return;try{const {data}=await sb.auth.getSession();if(data.session&&!appStarted)await enter(data.session.user)}catch(e){console.warn("Page session restore failed",e)}});
async function enter(user){if(appStarted)return;const uid=user?.id||(await sb.auth.getUser()).data.user?.id;if(!uid)return;const cached=getCachedManager();const {data:p,error}=await sb.from("manager_profiles").select("active,role,display_name").eq("user_id",uid).maybeSingle();if(error){if(cached?.user_id===uid&&cached.active===true){appStarted=true;login.classList.add("hidden");app.classList.remove("hidden");await loadMonth();await loadEnquiries();startRealtime();return}loginMsg.innerHTML='<div class="msg err">Unable to verify the manager account right now. Please keep the app open and connected.</div>';return}if(!p?.active){loginMsg.innerHTML='<div class="msg err">Not authorized.</div>';await sb.auth.signOut();return}cacheManager(user,p);appStarted=true;login.classList.add("hidden");app.classList.remove("hidden");await loadMonth();await loadEnquiries();startRealtime()}
function startRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("kvn-manager-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"enquiries"},()=>{loadEnquiries();notify("New KVN enquiry received")}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"enquiries"},loadEnquiries).on("postgres_changes",{event:"*",schema:"public",table:"calendar_dates"},loadMonth).on("postgres_changes",{event:"*",schema:"public",table:"muhurtham_dates"},loadMonth).subscribe()}
function notify(text){const el=document.createElement("div");el.className="msg ok live-notify";el.textContent="🔔 "+text;document.querySelector("#enquiryTab .card")?.prepend(el);setTimeout(()=>el.remove(),5000)}
loginBtn.onclick=async()=>{loginMsg.innerHTML="";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)loginMsg.innerHTML='<div class="msg err">'+esc(error.message)+'</div>'};logout.onclick=async()=>{await sb.auth.signOut();try{localStorage.removeItem(MANAGER_AUTH_KEY)}catch(e){}};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");const showCalendar=b.dataset.tab==="calendarTab";calendarTab.classList.toggle("hidden",!showCalendar);enquiryTab.classList.toggle("hidden",showCalendar)});prev.onclick=()=>{view.setMonth(view.getMonth()-1);loadMonth()};next.onclick=()=>{view.setMonth(view.getMonth()+1);loadMonth()};
async function loadMonth(){rows={};mus={};bookings={};const y=view.getFullYear(),m=view.getMonth(),from=key(y,m,1),to=key(y,m,new Date(y,m+1,0).getDate());const [c,mu,bd]=await Promise.all([sb.from("calendar_dates").select("*").gte("date",from).lte("date",to),sb.from("muhurtham_dates").select("*").gte("date",from).lte("date",to),sb.from("booking_details").select("*").gte("date",from).lte("date",to)]);if(c.error){editor.innerHTML='<div class="msg err">'+esc(c.error.message)+'</div>';return}(c.data||[]).forEach(r=>rows[r.date]=r);(mu.data||[]).forEach(r=>mus[r.date]=r);(bd.data||[]).forEach(r=>{bookings[r.date+':'+r.slot]=r});render()}
function bookingFieldsHtml(slot,r){const existing=bookings[selected+':'+slot]||{};const booked=r[slot+'_status']==='booked';return `<div class="booking-fields ${booked?'open':''}" data-slot="${slot}"><label>Event / Function Name</label><input type="text" data-field="event_name" placeholder="e.g. Sharma-Iyer Wedding" value="${esc(existing.event_name||'')}"><label>Customer Name</label><input type="text" data-field="customer_name" placeholder="Primary contact person" value="${esc(existing.customer_name||'')}"><label>Customer Phone</label><input type="tel" data-field="customer_phone" placeholder="+91 98400 00000" value="${esc(existing.customer_phone||'')}"><label>Internal Notes for this Slot</label><textarea data-field="manager_notes" placeholder="Deposit received? Menu selection? Anything the team should know...">${esc(existing.manager_notes||'')}</textarea></div>`}
function selectDate(k,r,mu){selected=k;const muBadge=mu?' <span style="color:var(--marigold-deep);font-weight:700;font-size:.85rem">❋ Muhurtham</span>':'';editor.innerHTML=`<div class="h">${new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}${muBadge}</div><div class="grid"><div><label>Morning Status</label><select id="editMorning"><option value="available" ${r.morning_status==="available"?"selected":""}>Available</option><option value="booked" ${r.morning_status==="booked"?"selected":""}>Booked</option></select></div><div><label>Evening Status</label><select id="editEvening"><option value="available" ${r.evening_status==="available"?"selected":""}>Available</option><option value="booked" ${r.evening_status==="booked"?"selected":""}>Booked</option></select></div></div><div class="slot-section"><div class="slot-section-title">🌅 Morning Slot Details</div>${bookingFieldsHtml('morning',r)}</div><div class="slot-section"><div class="slot-section-title">🌆 Evening Slot Details</div>${bookingFieldsHtml('evening',r)}</div><label>General Manager Note (whole day)</label><textarea id="editNote" placeholder="Any general note about this date...">${esc(r.manager_note||"")}</textarea><div class="editor-actions" style="margin-top:14px"><button class="btn" id="saveDate">Save Availability & Booking Details</button></div>`;const toggleFields=()=>{document.querySelectorAll('.booking-fields').forEach(bf=>{const slot=bf.dataset.slot;const sel=document.getElementById(slot==='morning'?'editMorning':'editEvening');bf.classList.toggle('open',sel.value==='booked')})};document.getElementById('editMorning').onchange=toggleFields;document.getElementById('editEvening').onchange=toggleFields;document.getElementById("saveDate").onclick=async()=>{const payload={date:k,morning_status:editMorning.value,evening_status:editEvening.value,manager_note:editNote.value.trim()};const {error}=await sb.from("calendar_dates").upsert(payload,{onConflict:"date"});if(error){editor.insertAdjacentHTML("beforeend",'<div class="msg err">'+esc(error.message)+'</div>');return}for(const slot of ['morning','evening']){const bf=document.querySelector('.booking-fields[data-slot="'+slot+'"]');const status=document.getElementById(slot==='morning'?'editMorning':'editEvening').value;if(status==='booked'){const bp={date:k,slot,event_name:bf.querySelector('[data-field=event_name]').value.trim()||null,customer_name:bf.querySelector('[data-field=customer_name]').value.trim()||null,customer_phone:bf.querySelector('[data-field=customer_phone]').value.trim()||null,manager_notes:bf.querySelector('[data-field=manager_notes]').value.trim()||null};const {error:e2}=await sb.from("booking_details").upsert(bp,{onConflict:"date,slot"});if(e2){editor.insertAdjacentHTML("beforeend",'<div class="msg err">Booking details: '+esc(e2.message)+'</div>');return}}else{await sb.from("booking_details").delete().eq('date',k).eq('slot',slot)}}editor.insertAdjacentHTML("beforeend",'<div class="msg ok">Saved successfully.</div>');await loadMonth();setTimeout(()=>{const savedMsg=editor.querySelector('.msg.ok');if(savedMsg)savedMsg.remove()},2500)}}
function slotHtml(status,label){const cls=status==='booked'?'booked':'available';const state=status==='booked'?'Booked':'Free';return `<div class="slot ${cls}"><span>${label}</span><span class="slot-state">${state}</span></div>`}
function render(){const y=view.getFullYear(),m=view.getMonth();month.textContent=new Date(y,m,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});days.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)days.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=key(y,m,d),r=rows[k]||{morning_status:"available",evening_status:"available"},mu=mus[k];const isPast=new Date(y,m,d)<today();const el=document.createElement("div");el.className="day"+(isPast?" past":"")+(selected===k?" selected":"");const amCls='am-'+(r.morning_status==='booked'?'booked':'available');const pmCls='pm-'+(r.evening_status==='booked'?'booked':'available');el.innerHTML=`<div class="day-circle ${amCls} ${pmCls}"><div class="day-divider"></div><span class="day-num">${d}</span>${mu?'<span class="mu-mark-mgr" title="Muhurtham">❋</span>':''}</div>`;if(!isPast)el.onclick=()=>selectDate(k,r,mu);days.appendChild(el)}}
async function loadEnquiries(){if(!sb)return;const {data,error}=await sb.from("enquiries").select("*").order("created_at",{ascending:false});if(error){enquiries.innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}if(!data?.length){enquiries.innerHTML='<div class="small">No enquiries yet.</div>';return}enquiries.innerHTML=data.map(r=>`<article class="enq ${r.status==="declined"||r.status==="confirmed"?"resolved":""}"><div class="row"><strong>${esc(r.name||"Unnamed")}</strong><span class="status">${esc((r.status||"new").replace('_',' '))}</span></div><p class="small">${esc(r.event_type||"Event")} · ${esc(r.phone||"")} · ${esc(r.email||"")}<br>${esc(r.event_date||"")} ${esc(r.slot||"")} · ${esc(r.guest_count||"")} guests</p><p>${esc(r.message||"")}</p><div class="row"><select data-id="${r.id}" class="status-select"><option value="new" ${r.status==="new"?"selected":""}>New</option><option value="contacted" ${r.status==="contacted"?"selected":""}>Contacted</option><option value="advance_paid" ${r.status==="advance_paid"?"selected":""}>Advance Paid</option><option value="confirmed" ${r.status==="confirmed"?"selected":""}>Confirmed</option><option value="declined" ${r.status==="declined"?"selected":""}>Declined</option></select><a class="btn light" href="tel:${esc(r.phone||"")}">Call</a></div></article>`).join("");document.querySelectorAll(".status-select").forEach(s=>s.onchange=async()=>{const {error}=await sb.from("enquiries").update({status:s.value}).eq("id",s.dataset.id);if(error)alert(error.message);else loadEnquiries()})}
refresh.onclick=loadEnquiries;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.classList.remove("hidden")});installBtn.onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.classList.add("hidden")};window.addEventListener("appinstalled",()=>installBtn.classList.add("hidden"));
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("manager-sw.js").catch(e=>console.warn("SW registration failed",e)));
start();
</script>
