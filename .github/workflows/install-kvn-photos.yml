name: Install KVN actual photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/replace-with-actual-kvn-photos
          fetch-depth: 0
      - name: Extract actual photos
        run: |
          unzip -o kvn_assets_deploy.zip
          rm kvn_assets_deploy.zip
      - name: Commit actual photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git commit -m "Replace KVN gallery photos with supplied venue images" || exit 0
          git push origin HEAD:feature/replace-with-actual-kvn-photos
      - name: Remove installer workflow
        run: |
          git rm .github/workflows/install-kvn-photos.yml
          git commit -m "Remove photo installer workflow" || exit 0
          git push origin HEAD:feature/replace-with-actual-kvn-photos
