name: KVN 60-second synchronization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 60-second synchronization
        shell: python
        run: |
          from pathlib import Path

          root = Path('KVN mahal website & webapp')

          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')
          marker = '/* KVN_60S_SYNC */'
          block = '''\n<script>\n/* KVN_60S_SYNC */\n(function(){\n  const sync = async () => {\n    try {\n      if (typeof loadCalendar === 'function') await loadCalendar();\n    } catch (e) { console.warn('KVN public calendar sync failed', e); }\n  };\n  setInterval(sync, 60000);\n  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });\n  window.addEventListener('pageshow', sync);\n})();\n</script>\n'''
          if marker not in s:
              s = s.replace('</body>', block + '</body>')
              index.write_text(s, encoding='utf-8')

          manager = root / 'manager.html'
          s = manager.read_text(encoding='utf-8')
          marker = '/* KVN_60S_SYNC */'
          block = '''\n<script>\n/* KVN_60S_SYNC */\n(function(){\n  const sync = async () => {\n    try {\n      if (typeof loadMonth === 'function') await loadMonth();\n      if (typeof loadEnquiries === 'function') await loadEnquiries();\n    } catch (e) { console.warn('KVN manager sync failed', e); }\n  };\n  setInterval(sync, 60000);\n  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && typeof appStarted !== 'undefined' && appStarted) sync(); });\n  window.addEventListener('pageshow', () => { if (typeof appStarted !== 'undefined' && appStarted) sync(); });\n})();\n</script>\n'''
          if marker not in s:
              s = s.replace('</body>', block + '</body>')
              manager.write_text(s, encoding='utf-8')

      - name: Commit synchronization patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "KVN mahal website & webapp/index.html" "KVN mahal website & webapp/manager.html"
          git diff --cached --quiet || git commit -m "Add 60-second synchronization to KVN website and manager"
          git push
